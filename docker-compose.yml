services:
  backend:
    build:
      context: ./backend
    image: beyond-sea-travels-backend:local
    env_file:
      - ./backend/.env
    environment:
      PORT: 5001
      FRONTEND_URL: http://localhost:3000
    ports:
      - "5001:5001"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5001/api
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
        NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER:-}
    image: beyond-sea-travels-frontend:local
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:5001/api
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER:-}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
