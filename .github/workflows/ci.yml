name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      NEXT_PUBLIC_API_URL: http://localhost:5001/api
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_WHATSAPP_NUMBER: "+10000000000"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: beyond_sea_travels_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d beyond_sea_travels_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/beyond_sea_travels_ci?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/beyond_sea_travels_ci?schema=public
      JWT_SECRET: ci-placeholder-jwt-secret-do-not-use-in-production
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: http://localhost:3000
      PORT: "5001"
      PUBLIC_API_URL: http://localhost:5001

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Seed test database
        run: npm run prisma:seed

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Audit high severity vulnerabilities
        run: npm audit --audit-level=high

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create safe Docker environment placeholders
        run: |
          cat > backend/.env <<'EOF'
          PORT=5001
          FRONTEND_URL=http://localhost:3000
          DATABASE_URL="postgresql://postgres:postgres@postgres:5432/beyond_sea_travels?schema=public"
          DIRECT_URL="postgresql://postgres:postgres@postgres:5432/beyond_sea_travels?schema=public"
          JWT_SECRET="ci-placeholder-jwt-secret-do-not-use-in-production"
          JWT_EXPIRES_IN=7d
          PUBLIC_API_URL=http://localhost:5001
          EOF

      - name: Build Docker images
        run: docker compose build
