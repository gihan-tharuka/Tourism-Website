services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: beyond_sea_travels
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - beyond-sea-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d beyond_sea_travels"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/beyond_sea_travels?schema=public
      DIRECT_URL: postgresql://postgres:postgres@postgres:5432/beyond_sea_travels?schema=public
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  beyond-sea-postgres-data:
